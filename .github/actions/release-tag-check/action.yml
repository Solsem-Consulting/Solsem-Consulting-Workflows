name: Release tag check
description: Fail unless the release runs on a v-tag that points to a commit on the repository's default branch (Linux, Windows, and macOS runners)

inputs:
  tag:
    description: "Release tag; defaults to the tag the run was started on"
    required: false
    default: ""
  tag-pattern:
    description: "Glob the tag must match, for example v* or mac-v*"
    required: false
    default: "v*"
  token:
    description: "Token for the GitHub API"
    required: false
    default: ${{ github.token }}

outputs:
  tag:
    description: "The checked release tag"
    value: ${{ steps.check.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Require release tag on default branch
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        INPUT_TAG: ${{ inputs.tag }}
        TAG_PATTERN: ${{ inputs.tag-pattern }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        tag="${INPUT_TAG:-}"
        if [ -z "$tag" ] && [ "$REF_TYPE" = "tag" ]; then
          tag="$REF_NAME"
        fi
        if [ -z "$tag" ]; then
          echo "::error::A release must run on a tag: gh workflow run <workflow> --ref <tag>."
          exit 1
        fi
        if ! [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Release tag contains unexpected characters."
          exit 1
        fi
        # shellcheck disable=SC2053 # TAG_PATTERN is a glob on purpose.
        if [[ "$tag" != $TAG_PATTERN ]]; then
          echo "::error::Release tag $tag does not match $TAG_PATTERN."
          exit 1
        fi
        if [ -z "${DEFAULT_BRANCH:-}" ]; then
          echo "::error::Could not determine the default branch of $REPOSITORY."
          exit 1
        fi

        # Resolve the tag to a commit; an annotated tag points to a tag object first.
        if ! ref_json="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')"; then
          echo "::error::Tag $tag was not found in $REPOSITORY."
          exit 1
        fi
        read -r type sha <<< "$ref_json"
        for _ in 1 2 3; do
          [ "$type" = "tag" ] || break
          type="$(gh api "repos/$REPOSITORY/git/tags/$sha" --jq .object.type)"
          sha="$(gh api "repos/$REPOSITORY/git/tags/$sha" --jq .object.sha)"
        done
        if [ "$type" != "commit" ]; then
          echo "::error::Tag $tag does not point to a commit."
          exit 1
        fi
        # The run builds github.sha; it must be the tagged commit.
        if [ "$REF_TYPE" = "tag" ] && [ "$sha" != "$SHA" ]; then
          echo "::error::Tag $tag points to $sha, but this run builds $SHA. Start the release on the tag."
          exit 1
        fi

        # The commit is on the default branch when it is the branch tip or one of its ancestors.
        status="$(gh api "repos/$REPOSITORY/compare/$DEFAULT_BRANCH...$sha" --jq .status)"
        case "$status" in
          identical | behind)
            echo "Tag $tag ($sha) is on $DEFAULT_BRANCH."
            ;;
          *)
            echo "::error::Tag $tag ($sha) is not on $DEFAULT_BRANCH (compare status: $status). Releases must be tagged from $DEFAULT_BRANCH."
            exit 1
            ;;
        esac
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
