name: Explicit secrets caller fixture
on:
  workflow_dispatch:
jobs:
  build:
    uses: ./.github/workflows/SC-Build.yml
    with:
      build_target: src/Product.slnx
    secrets:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
  quality:
    uses: ./.github/workflows/SC-Quality.yml
    with:
      test_projects: '["Product.Tests.csproj"]'
    secrets:
      GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
  provenance:
    uses: ./.github/workflows/SC-Provenance.yml
    with:
      release_artifact: signed-release
      product_name: Product
      release_version: 1.0.0
      public_key: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
    secrets:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
