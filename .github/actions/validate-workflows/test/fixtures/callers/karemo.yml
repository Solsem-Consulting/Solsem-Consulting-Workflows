name: Karemo caller fixture
on:
  workflow_dispatch:
jobs:
  core:
    uses: ./.github/workflows/sc-core.yml
    with:
      solution: src/SetecAstronomy/Karemo.slnx
  build:
    uses: ./.github/workflows/SC-Build.yml
    with:
      build_target: src/SetecAstronomy/Karemo.slnx
    secrets: inherit
  quality:
    uses: ./.github/workflows/SC-Quality.yml
    with:
      test_projects: '["Karemo.Application.Tests.csproj"]'
    secrets: inherit
  approval:
    uses: ./.github/workflows/SC-Approval.yml
    with:
      candidate_artifact: release-candidate
  provenance:
    uses: ./.github/workflows/SC-Provenance.yml
    with:
      release_artifact: signed-release
      product_name: Karemo
      release_version: 1.0.0.1
      public_key: test-public-key
    secrets: inherit
  post:
    uses: ./.github/workflows/sc-post.yml
    with:
      evidence_artifact: release-evidence
      public_key: test-public-key
