name: Workflow pin policy

# Manual only, to save Actions minutes on the free plan. Run ./scripts/Test-WorkflowPins.ps1 locally before merging.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-workflow-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject mutable workflow references
        shell: pwsh
        run: ./scripts/Test-WorkflowPins.ps1
