name: SC-Post

on:
  workflow_call:
    inputs:
      create_github_release:
        description: "Create a GitHub Release for tag-triggered runs"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Write release summary
        shell: bash
        run: |
          {
            echo "## Shared release pipeline"
            echo
            echo "- Repository: \`${{ github.repository }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Status: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
