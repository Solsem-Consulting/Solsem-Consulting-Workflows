name: SC-Core

on:
  workflow_call:
    inputs:
      solution:
        description: "Repository-relative solution path"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate repository contract
        shell: pwsh
        env:
          SOLUTION: ${{ inputs.solution }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOLUTION)) {
            throw "Solution path is required."
          }
          if ([IO.Path]::GetExtension($env:SOLUTION) -notin @('.sln', '.slnx')) {
            throw "Solution must be a .sln or .slnx file: $env:SOLUTION"
          }
          if (-not (Test-Path -LiteralPath $env:SOLUTION -PathType Leaf)) {
            throw "Solution not found: $env:SOLUTION"
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Repository contains whitespace errors."
          }

      - name: Write preflight summary
        shell: pwsh
        env:
          SOLUTION: ${{ inputs.solution }}
        run: |
          @(
            '## Shared preflight'
            ''
            "- Repository: ``${{ github.repository }}``"
            "- Ref: ``${{ github.ref }}``"
            "- Solution: ``$env:SOLUTION``"
            '- Status: passed'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
