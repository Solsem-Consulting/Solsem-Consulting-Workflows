name: SC-Quality

on:
  workflow_call:
    inputs:
      test_projects:
        description: "JSON array of repository-relative test project paths"
        required: true
        type: string
      nuget_config:
        description: "Optional repository-relative NuGet.config path"
        required: false
        default: ""
        type: string
      dotnet_version:
        description: ".NET SDK version"
        required: false
        default: "10.0.x"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  quality:
    runs-on: windows-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN || secrets.GH_PACKAGES_READ_TOKEN || github.token }}
      TEST_PROJECTS: ${{ inputs.test_projects }}
      NUGET_CONFIG: ${{ inputs.nuget_config }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Run configured tests
        shell: pwsh
        run: |
          $projects = @($env:TEST_PROJECTS | ConvertFrom-Json)
          if ($projects.Count -eq 0) {
            throw "At least one test project is required."
          }

          foreach ($project in $projects) {
            if ([IO.Path]::GetExtension($project) -ne '.csproj' -or -not (Test-Path -LiteralPath $project -PathType Leaf)) {
              throw "Invalid test project: $project"
            }

            $restoreArguments = @('restore', $project, '--nologo', '--verbosity', 'minimal', '-m:1', '-nr:false')
            if (-not [string]::IsNullOrWhiteSpace($env:NUGET_CONFIG)) {
              if (-not (Test-Path -LiteralPath $env:NUGET_CONFIG -PathType Leaf)) {
                throw "NuGet config not found: $env:NUGET_CONFIG"
              }
              $restoreArguments += @('--configfile', $env:NUGET_CONFIG)
            }

            & dotnet @restoreArguments
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for $project." }

            dotnet test $project --configuration Release --no-restore --nologo --verbosity minimal -m:1 -nr:false -p:EnableWindowsTargeting=true -p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw "dotnet test failed for $project." }
          }

      - name: Write quality summary
        shell: pwsh
        run: |
          $projects = @($env:TEST_PROJECTS | ConvertFrom-Json)
          @(
            '## Shared quality gate'
            ''
            "- Test projects: $($projects.Count)"
            '- Status: passed'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
