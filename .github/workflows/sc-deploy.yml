name: SC-Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag for product workflows that support an explicit tag"
        required: false
        default: ""
        type: string
      version:
        description: "Release version for product workflows that support an explicit version"
        required: false
        default: ""
        type: string
      skip_ftp:
        description: "Skip FTPS upload"
        required: false
        default: false
        type: boolean
      skip_website:
        description: "Skip website update"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Plan deployment without external writes"
        required: false
        default: false
        type: boolean

jobs:
  cvsmia:
    if: ${{ github.repository == 'Solsem-Consulting/cvsmia' }}
    uses: Solsem-Consulting/cvsmia/.github/workflows/release-publish-ftp.yml@main
    with:
      tag: ${{ inputs.tag }}
      version: ${{ inputs.version }}
      skipFtp: ${{ inputs.skip_ftp }}
      skipWebsite: ${{ inputs.skip_website }}
      dryRun: ${{ inputs.dry_run }}
    secrets: inherit

  karemo:
    if: ${{ github.repository == 'Solsem-Consulting/KaremoSuite' }}
    uses: Solsem-Consulting/KaremoSuite/.github/workflows/publish-ftp.yml@main
    secrets: inherit

  unsupported-repository:
    if: ${{ github.repository != 'Solsem-Consulting/cvsmia' && github.repository != 'Solsem-Consulting/KaremoSuite' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported repository
        shell: bash
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Unsupported release caller: ${CALLER_REPOSITORY}" >&2
          exit 1
