name: SC-Approval

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Optional release tag override"
        required: false
        default: ""
        type: string
      release_version:
        description: "Optional release version override"
        required: false
        default: ""
        type: string
      version_file:
        description: "Optional repository-relative text file holding the release version, read when no version is given"
        required: false
        default: ""
        type: string
      approvers:
        description: "Comma-separated GitHub users or organization teams allowed to approve"
        required: false
        default: "HarrySolsem"
        type: string
      minimum_approvals:
        description: "Number of approvals required before the release continues"
        required: false
        default: 1
        type: number
      timeout_minutes:
        description: "Maximum minutes to wait for approval; the runner is held while waiting"
        required: false
        default: 60
        type: number
      candidate_artifact:
        description: "Optional workflow artifact holding the release candidate; its file hashes are shown to approvers and returned as outputs"
        required: false
        default: ""
        type: string
    outputs:
      approved_sha:
        description: "Commit SHA the approval applies to"
        value: ${{ jobs.approval.outputs.approved_sha }}
      candidate_manifest:
        description: "Approved candidate manifest (sha256sum format); empty without candidate_artifact"
        value: ${{ jobs.approval.outputs.candidate_manifest }}
      candidate_digest:
        description: "SHA-256 of the approved candidate manifest; empty without candidate_artifact"
        value: ${{ jobs.approval.outputs.candidate_digest }}

permissions:
  contents: read
  issues: write

jobs:
  approval:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      approved_sha: ${{ github.sha }}
      candidate_manifest: ${{ steps.candidate.outputs.manifest }}
      candidate_digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate artifact
        if: ${{ inputs.candidate_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/release-candidate

      - name: Hash candidate artifact
        id: candidate
        if: ${{ inputs.candidate_artifact != '' }}
        uses: Solsem-Consulting/Solsem-Consulting-Workflows/.github/actions/candidate-manifest@7ee4279d05ee8e35ed7ca2c6a6b15ffe12dcd751 # candidate-manifest 2026-09-28
        with:
          path: ${{ runner.temp }}/release-candidate

      - name: Prepare approval context
        id: approval-context
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.event.inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
          REQUESTED_VERSION: ${{ inputs.release_version || github.event.inputs.version || '' }}
          VERSION_FILE: ${{ inputs.version_file }}
          APPROVERS: ${{ inputs.approvers }}
          MINIMUM_APPROVALS: ${{ inputs.minimum_approvals }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.manifest }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APPROVERS)) {
            throw "At least one approver is required."
          }
          if ([int]$env:MINIMUM_APPROVALS -lt 1) {
            throw "minimum_approvals must be at least 1: $env:MINIMUM_APPROVALS"
          }

          $version = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($version) -and -not [string]::IsNullOrWhiteSpace($env:VERSION_FILE)) {
            if (-not (Test-Path -LiteralPath $env:VERSION_FILE -PathType Leaf)) {
              throw "Version file not found: $env:VERSION_FILE"
            }
            $version = (Get-Content -LiteralPath $env:VERSION_FILE -Raw).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($version) -and (Test-Path -LiteralPath 'Directory.Build.props')) {
            [xml]$props = Get-Content -LiteralPath 'Directory.Build.props'
            $version = [string]$props.Project.PropertyGroup.Version
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '(ikke funnet)'
          }

          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = '(ingen eksplisitt tag)'
          }

          $repositoryUrl = "https://github.com/$($env:REPOSITORY)"
          $runUrl = "$repositoryUrl/actions/runs/$($env:RUN_ID)"
          $commitUrl = "$repositoryUrl/commit/$($env:SHA)"
          $currentTag = if ($tag -like 'v*') { $tag } else { '' }
          $tagsAtCandidate = @(git tag --points-at $env:SHA --list 'v*')
          $describeTarget = if ($currentTag -and $tagsAtCandidate -contains $currentTag) { "$($env:SHA)^" } else { $env:SHA }
          $previousTag = [string](git describe --tags --match 'v*' --abbrev=0 $describeTarget 2>$null)
          if ($LASTEXITCODE -ne 0) {
            $previousTag = ''
          }
          $range = if ($previousTag) { "$previousTag..$($env:SHA)" } else { $env:SHA }
          $compareUrl = if ($previousTag) { "$repositoryUrl/compare/$previousTag...$($env:SHA)" } else { $commitUrl }
          $changesLabel = if ($previousTag) { "Endringer siden $previousTag" } else { 'Kandidat-commit' }

          $commitLines = @(git log $range --max-count=20 --format='%H%x09%h%x09%s' | ForEach-Object {
              $parts = $_ -split "`t", 3
              if ($parts.Count -eq 3) {
                  "- [$($parts[1])]($repositoryUrl/commit/$($parts[0])) $($parts[2])"
              }
          })
          if ($commitLines.Count -eq 0) {
            $commitLines = @('- Ingen commits funnet for sammenligningen.')
          }

          $fileLines = if ($previousTag) {
            @(git diff --name-only "$previousTag..$($env:SHA)" | Select-Object -First 30 | ForEach-Object { "- ``$_``" })
          }
          else {
            @('- Åpne kandidat-commit for å kontrollere endrede filer.')
          }
          if ($fileLines.Count -eq 0) {
            $fileLines = @('- Ingen endrede filer funnet.')
          }

          if ([string]::IsNullOrWhiteSpace($env:CANDIDATE_ARTIFACT)) {
            $candidateRow = '| Kandidatartefakt | ikke oppgitt; godkjenningen binder ingen filer |'
            $candidateLines = @()
            $candidateChecks = @()
          }
          else {
            $candidateEntries = @($env:CANDIDATE_MANIFEST -split "`n" | Where-Object { $_ })
            $candidateRow = "| Kandidatartefakt | ``$($env:CANDIDATE_ARTIFACT)``: $($candidateEntries.Count) filer, manifest-SHA-256 ``$($env:CANDIDATE_DIGEST)`` |"
            $candidateLines = @(
              '## Kandidatfiler som godkjennes'
              ''
              'Deploy-workflowen publiserer disse filene uten å bygge på nytt, og stopper hvis en fil mangler, er endret eller er lagt til før signering og opplasting.'
              ''
              '| Fil | SHA-256 |'
              '|---|---|'
              $candidateEntries | ForEach-Object { "| ``$($_.Substring(66))`` | ``$($_.Substring(0, 64))`` |" }
              ''
            )
            $candidateChecks = @('- [ ] Kandidatfilene og hashene hører til denne releasen.')
          }

          $approvalPath = Join-Path $env:GITHUB_WORKSPACE '.release-approval.md'
          @(
            '# Beslutning om produksjonspublisering'
            ''
            '| Felt | Kandidat |'
            '|---|---|'
            "| Repository | ``$($env:REPOSITORY)`` |"
            "| Versjon | ``$version`` |"
            "| Tag | ``$tag`` |"
            "| Ref | ``$($env:REF_NAME)`` |"
            "| Commit | [$($env:SHA.Substring(0, 12))]($commitUrl) |"
            "| Utløser | ``$($env:EVENT_NAME)`` av ``$($env:ACTOR)`` |"
            "| Workflow | [Åpne kjøring]($runUrl) |"
            "| Godkjennere | ``$($env:APPROVERS)`` (minst $($env:MINIMUM_APPROVALS)) |"
            $candidateRow
            ''
            '## Hva godkjenningen tillater'
            ''
            'Godkjenning starter produktets release-workflow. Den kan pakke og signere binærfiler, laste opp release-filer og oppdateringsmanifest til produksjons-FTP, forberede en pull request for nettsiden og opprette en GitHub Release ved tag-kjøringer.'
            ''
            '## Lenker for kontroll'
            ''
            "- [$changesLabel]($compareUrl)"
            "- [Eksakt kandidat-commit]($commitUrl)"
            "- [Build- og quality-kjøring]($runUrl)"
            ''
            $candidateLines
            '## Commits (maksimum 20)'
            ''
            $commitLines
            ''
            '## Endrede filer (maksimum 30)'
            ''
            $fileLines
            ''
            '## Sjekkliste før beslutning'
            ''
            '- [ ] Versjon og tag identifiserer riktig release.'
            '- [ ] Kandidat-commit og endringene er forstått.'
            $candidateChecks
            '- [ ] Build- og quality-jobbene er grønne.'
            '- [ ] Brukerrettet release-informasjon er klar for gjennomgang.'
            '- [ ] Publisering til produksjons-FTP skal skje nå.'
            ''
            '## Beslutning'
            ''
            '- Kommenter kun **`ja`** eller **`yes`** for å godkjenne og fortsette.'
            '- Kommenter kun **`nei`** eller **`no`** for å avvise og stoppe.'
          ) | Out-File -LiteralPath $approvalPath -Encoding utf8

          "path=$approvalPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "title=Publiseringsgodkjenning: $($env:REPOSITORY) $version ($($env:SHA.Substring(0, 7)))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Await manual approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ inputs.approvers }}
          minimum-approvals: ${{ inputs.minimum_approvals }}
          issue-title: ${{ steps.approval-context.outputs.title }}
          issue-body-file-path: ${{ steps.approval-context.outputs.path }}
          additional-approved-words: ja,godkjenn,godkjent
          additional-denied-words: nei,avvis,avvist

      # An approval applies to one commit. If the release tag was moved while the
      # approval was pending, a new run builds and approves the new commit instead.
      - name: Verify release tag still points to the approved commit
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APPROVED_SHA: ${{ github.sha }}
        run: |
          $object = gh api "repos/$env:REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --jq '.object' | ConvertFrom-Json
          for ($depth = 0; $object.type -eq 'tag' -and $depth -lt 5; $depth++) {
            $object = gh api "repos/$env:REPOSITORY/git/tags/$($object.sha)" --jq '.object' | ConvertFrom-Json
          }
          if ($LASTEXITCODE -ne 0 -or $object.type -ne 'commit') {
            throw "Could not resolve release tag $env:RELEASE_TAG to a commit after approval."
          }
          if ($object.sha -ne $env:APPROVED_SHA) {
            throw "Release tag $env:RELEASE_TAG now points to $($object.sha), but the approval applies to $env:APPROVED_SHA. Start a new release run for the moved tag."
          }
          Write-Host "Release tag $env:RELEASE_TAG still points to the approved commit $env:APPROVED_SHA."
