name: SC-Build

on:
  workflow_call:
    inputs:
      build_target:
        description: "Repository-relative project or solution path used by the shared build gate"
        required: true
        type: string
      test_projects:
        description: "Optional JSON array of repository-relative test project paths, run right after the build on the same runner"
        required: false
        default: ""
        type: string
      nuget_config:
        description: "Optional repository-relative NuGet.config path"
        required: false
        default: ""
        type: string
      dotnet_version:
        description: ".NET SDK version"
        required: false
        default: "10.0.x"
        type: string
      timeout_minutes:
        description: "Maximum minutes for the build job"
        required: false
        default: 60
        type: number
    secrets:
      NUGET_AUTH_TOKEN:
        description: "Optional token for authenticated NuGet feeds"
        required: false
      GH_PACKAGES_READ_TOKEN:
        description: "Optional token with read:packages, used when NUGET_AUTH_TOKEN is not set"
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN || secrets.GH_PACKAGES_READ_TOKEN || github.token }}
      BUILD_TARGET: ${{ inputs.build_target }}
      NUGET_CONFIG: ${{ inputs.nuget_config }}
      TEST_PROJECTS: ${{ inputs.test_projects }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:BUILD_TARGET -PathType Leaf)) {
            throw "Build target not found: $env:BUILD_TARGET"
          }
          $arguments = @('restore', $env:BUILD_TARGET, '--nologo', '--verbosity', 'minimal', '-m:1', '-nr:false')
          if (-not [string]::IsNullOrWhiteSpace($env:NUGET_CONFIG)) {
            if (-not (Test-Path -LiteralPath $env:NUGET_CONFIG -PathType Leaf)) {
              throw "NuGet config not found: $env:NUGET_CONFIG"
            }
            $arguments += @('--configfile', $env:NUGET_CONFIG)
          }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }

      - name: Build
        shell: pwsh
        run: |
          $arguments = @(
            'build',
            $env:BUILD_TARGET,
            '--configuration', 'Release',
            '--nologo',
            '--verbosity', 'minimal',
            '-m:1',
            '-nr:false',
            '-p:EnableWindowsTargeting=true',
            '-p:UseSharedCompilation=false'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:NUGET_CONFIG)) {
            $configPath = (Resolve-Path -LiteralPath $env:NUGET_CONFIG).Path
            $arguments += "-p:RestoreConfigFile=$configPath"
          }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed." }

      - name: Run configured tests
        if: ${{ inputs.test_projects != '' }}
        shell: pwsh
        run: |
          $projects = @($env:TEST_PROJECTS | ConvertFrom-Json)
          if ($projects.Count -eq 0) {
            throw "test_projects must list at least one test project when it is set."
          }

          foreach ($project in $projects) {
            if ([IO.Path]::GetExtension($project) -ne '.csproj' -or -not (Test-Path -LiteralPath $project -PathType Leaf)) {
              throw "Invalid test project: $project"
            }

            # The build above already compiled projects that are part of the build target,
            # so `dotnet test` finds them up to date and only builds what is missing.
            $restoreArguments = @('restore', $project, '--nologo', '--verbosity', 'minimal', '-m:1', '-nr:false')
            if (-not [string]::IsNullOrWhiteSpace($env:NUGET_CONFIG)) {
              $restoreArguments += @('--configfile', $env:NUGET_CONFIG)
            }

            & dotnet @restoreArguments
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for $project." }

            dotnet test $project --configuration Release --no-restore --nologo --verbosity minimal -m:1 -nr:false -p:EnableWindowsTargeting=true -p:UseSharedCompilation=false
            if ($LASTEXITCODE -ne 0) { throw "dotnet test failed for $project." }
          }

      - name: Write test summary
        if: ${{ inputs.test_projects != '' }}
        shell: pwsh
        run: |
          $projects = @($env:TEST_PROJECTS | ConvertFrom-Json)
          @(
            '## Shared build and test gate'
            ''
            "- Test projects: $($projects.Count)"
            '- Status: passed'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
