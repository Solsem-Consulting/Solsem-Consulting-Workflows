name: SC-Build

on:
  workflow_call:
    inputs:
      solution:
        description: "Navn på solution-fil som skal bygges"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/${{ inputs.solution }}

      - name: Build
        run: dotnet build src/${{ inputs.solution }} --configuration Release --no-restore

      - name: Test
        run: dotnet test src/${{ inputs.solution }} --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/${{ inputs.solution }} --configuration Release --no-build --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
