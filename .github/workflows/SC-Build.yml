name: SC-Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack (if applicable)
        run: |
          echo "Packing modules if repo contains packable projects..."
          dotnet pack --configuration Release --no-build --output ./artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sc-build
          path: artifacts
