name: SC-Build

on:
  workflow_call:
    inputs:
      build_target:
        description: "Repository-relative project or solution path used by the shared build gate"
        required: true
        type: string
      nuget_config:
        description: "Optional repository-relative NuGet.config path"
        required: false
        default: ""
        type: string
      dotnet_version:
        description: ".NET SDK version"
        required: false
        default: "10.0.x"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN || secrets.GH_PACKAGES_READ_TOKEN || github.token }}
      BUILD_TARGET: ${{ inputs.build_target }}
      NUGET_CONFIG: ${{ inputs.nuget_config }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:BUILD_TARGET -PathType Leaf)) {
            throw "Build target not found: $env:BUILD_TARGET"
          }
          $arguments = @('restore', $env:BUILD_TARGET, '--nologo', '--verbosity', 'minimal', '-m:1', '-nr:false')
          if (-not [string]::IsNullOrWhiteSpace($env:NUGET_CONFIG)) {
            if (-not (Test-Path -LiteralPath $env:NUGET_CONFIG -PathType Leaf)) {
              throw "NuGet config not found: $env:NUGET_CONFIG"
            }
            $arguments += @('--configfile', $env:NUGET_CONFIG)
          }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }

      - name: Build
        shell: pwsh
        run: |
          dotnet build $env:BUILD_TARGET --configuration Release --no-restore --nologo --verbosity minimal -m:1 -nr:false -p:EnableWindowsTargeting=true -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed." }
